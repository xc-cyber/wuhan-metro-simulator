name: Java CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: 编译
        run: javac -encoding UTF-8 -Xlint:all -d bin src/metro/*.java src/metro/exception/*.java

      - name: 运行全部功能测试
        run: |
          java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -cp bin metro.Test > test-output.log 2>&1
          cat test-output.log
          grep -q "全部测试执行完毕" test-output.log

      - name: 上传测试输出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
